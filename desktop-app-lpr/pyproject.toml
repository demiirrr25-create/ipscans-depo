[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipscans-lpr-pro"
version = "0.3.0"
description = "Independent IPScans LPR Pro local evaluation beta"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["numpy>=1.26,<3", "opencv-python>=4.10,<6", "onnxruntime>=1.20,<2"]
ocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]
onnx-ocr = ["fast-plate-ocr==1.1.0", "onnxruntime==1.31.0"]
desktop = ["PySide6>=6.8,<7", "bcrypt>=5,<6"]
test = ["pytest>=8,<10", "numpy>=1.26,<3"]

[project.scripts]
ipscans-lpr = "lpr.cli:main"
ipscans-lpr-lab = "lpr.desktop:main"
ipscans-lpr-pro = "lpr.application:main"

[tool.setuptools.packages.find]
include = ["lpr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
