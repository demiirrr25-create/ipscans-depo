[workspace]
resolver = "2"
members = [
    "crates/ipscans-core",
    "crates/ipscans-sentinel",
    "crates/ipscans-plus",
    "crates/ipcast",
    "crates/ipscans-lpr",
    "crates/ipscans-cortex",
    "crates/ipscans-health-pro",
    "crates/ipscans-cli",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
authors = ["IPScans Engineering <security@ipscans.com>"]
license = "LicenseRef-IPScans-Commercial"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
