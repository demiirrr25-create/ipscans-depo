<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ipscans — Network Scanner</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true">
            <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="none" stroke="#fff" stroke-width="3" />
            <circle cx="32" cy="32" r="9" fill="#fff" />
          </svg>
          <span>ipscans <em>Network Scanner</em></span>
        </div>
        <div class="controls">
          <input id="subnet" type="text" value="192.168.1.0/24" spellcheck="false" aria-label="Subnet (CIDR)" />
          <button id="scanBtn">Taramayı Başlat</button>
        </div>
      </header>

      <section class="status" id="status" aria-live="polite">Hazır.</section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>IP</th>
              <th>MAC</th>
              <th>Üretici</th>
              <th>Açık Portlar</th>
              <th>Seri No</th>
              <th>Kaynak</th>
            </tr>
          </thead>
          <tbody id="deviceRows"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
