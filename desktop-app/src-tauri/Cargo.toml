[package]
name = "ipscans-network-scanner"
version = "0.1.0"
description = "ipscans deep network scanner — ARP/ICMP discovery, SNMP, WMI, UPnP and ONVIF device fingerprinting"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ipscans_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }

# Layer 2/3 discovery: raw ARP requests + ICMP echo sweep
pnet = "0.35"
surge-ping = "0.8"

# SNMP v1/v2c GET for sysDescr/sysName/serial-number OIDs
snmp2 = "0.3"

# MAC address OUI -> vendor lookup (bundled IEEE OUI database)
mac_oui = "0.4"

# UPnP/SSDP discovery (M-SEARCH over UDP multicast)
ssdp-client = "2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
# WMI access (Win32_NetworkAdapter, Win32_BIOS/BaseBoard serial numbers, etc.)
wmi = "0.13"

[features]
custom-protocol = ["tauri/custom-protocol"]
