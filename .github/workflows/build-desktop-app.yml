name: Build IPscans+ for Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop-app/**"
      - ".github/workflows/build-desktop-app.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test discovery and topology
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax and source UI
        run: |
          python -m compileall -q app tests benchmarks
          python main.py --selftest

      - name: Benchmark bounded scheduling and UI responsiveness
        run: python benchmarks/scanner_benchmark.py --output scanner-benchmark.json

      - name: Build Windows EXE
        run: |
          pyinstaller --name IPscans-Plus --onefile --windowed --noupx `
            --icon=assets/icon.ico `
            --version-file=version_info.txt `
            --add-data "assets;assets" `
            main.py

      - name: Smoke test EXE
        run: |
          $process = Start-Process -FilePath ".\dist\IPscans-Plus.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged IPscans+ selftest failed" }

      - name: Install Inno Setup and build installer
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer\Scanner.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Smoke test installer and desktop shortcut
        run: |
          $setup = (Resolve-Path "dist\installer\IPscans-Plus-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "IPscansPlusInstallTest"
          $shortcut = Join-Path ([Environment]::GetFolderPath("DesktopDirectory")) "IPscans+.lnk"
          $process = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $installDir "IPscans-Plus.exe")) -or -not (Test-Path $shortcut)) {
            throw "IPscans+ install or desktop shortcut failed"
          }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ne (Join-Path $installDir "IPscans-Plus.exe")) { throw "Shortcut points to $target" }
          $process = Start-Process -FilePath (Join-Path $installDir "IPscans-Plus.exe") -ArgumentList "--selftest" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed application selftest failed" }
          $uninstaller = Join-Path $installDir "unins000.exe"
          $process = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path $shortcut)) { throw "IPscans+ uninstall failed" }

      - name: Record package checksums
        run: |
          Get-FileHash dist\IPscans-Plus.exe, dist\installer\IPscans-Plus-Setup.exe -Algorithm SHA256 |
            Select-Object Path, Hash | ConvertTo-Json | Set-Content dist\checksums.json

      - uses: actions/upload-artifact@v4
        with:
          name: IPscans-Plus-validation
          path: |
            desktop-app/scanner-benchmark.json
            desktop-app/dist/checksums.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: IPscans-Plus-portable
          path: desktop-app/dist/IPscans-Plus.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: IPscans-Plus-Setup
          path: desktop-app/dist/installer/IPscans-Plus-Setup.exe
          if-no-files-found: error
