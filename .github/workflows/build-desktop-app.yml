name: Build Windows desktop app

on:
  push:
    branches: [main]
    paths:
      - "desktop-app/**"
      - ".github/workflows/build-desktop-app.yml"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build one-file .exe
        run: |
          pyinstaller --name ipscans-network-scanner --onefile --windowed `
            --icon=assets/icon.ico `
            --add-data "assets;assets" `
            main.py

      - name: Smoke test the packaged .exe
        run: |
          .\dist\ipscans-network-scanner.exe --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: ipscans-network-scanner-windows
          path: desktop-app/dist/ipscans-network-scanner.exe
          if-no-files-found: error
