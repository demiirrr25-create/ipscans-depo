name: Build IPscans+ for Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop-app/**"
      - ".github/workflows/build-desktop-app.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test discovery and topology
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax and source UI
        run: |
          python -m compileall -q app tests benchmarks
          python main.py --selftest

      - name: Benchmark bounded scheduling and UI responsiveness
        run: |
          python benchmarks/scanner_benchmark.py --output scanner-benchmark.json
          python benchmarks/native_benchmark.py --output native-benchmark.json

      - name: Build Windows EXE
        run: |
          pyinstaller --name IPscans-Plus --onefile --windowed --noupx `
            --icon=assets/icon.ico `
            --version-file=version_info.txt `
            --add-data "assets;assets" `
            main.py

      - name: Smoke test EXE
        run: |
          $expected = [regex]::Match((Get-Content version_info.txt -Raw), "StringStruct\(u'FileVersion', u'([^']+)'\)").Groups[1].Value
          $actual = (Get-Item ".\dist\IPscans-Plus.exe").VersionInfo.FileVersion
          if (-not $expected -or $actual -ne $expected) { throw "Packaged version $actual does not match source $expected" }
          $process = Start-Process -FilePath ".\dist\IPscans-Plus.exe" -ArgumentList "--selftest" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged IPscans+ selftest failed" }

      - name: Install Inno Setup and build installer
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer\Scanner.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upgrade v4.0 to v4.1 and verify installer, shortcut and uninstall
        run: |
          $setup = (Resolve-Path "dist\installer\IPscans-Plus-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "IPscansPlusInstallTest"
          $shortcut = Join-Path ([Environment]::GetFolderPath("DesktopDirectory")) "IPscans+.lnk"
          $oldSetup = Join-Path $env:RUNNER_TEMP "IPscans-Plus-v4.0-Setup.exe"
          Invoke-WebRequest "https://github.com/demiirrr25-create/ipscans-depo/releases/download/ipscans-plus-v4.0.0/IPscans-Plus-Setup.exe" -OutFile $oldSetup
          if ((Get-FileHash $oldSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne "1a62124feba3ba0896761b12c483063d1399c47c549baa6c32c02f30a19b5970") { throw "v4.0 checksum mismatch" }
          $process = Start-Process -FilePath $oldSetup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Get-Item (Join-Path $installDir "IPscans-Plus.exe")).VersionInfo.FileVersion -ne "4.0.0.0") { throw "v4.0 baseline installation failed" }
          Set-Content (Join-Path $installDir "upgrade-preservation.txt") "User-owned file retained across upgrade"
          $process = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $installDir "IPscans-Plus.exe")) -or -not (Test-Path $shortcut)) {
            throw "IPscans+ install or desktop shortcut failed"
          }
          if ((Get-Item (Join-Path $installDir "IPscans-Plus.exe")).VersionInfo.FileVersion -ne "4.1.0.0") { throw "Upgrade did not install v4.1" }
          if (-not (Test-Path (Join-Path $installDir "upgrade-preservation.txt"))) { throw "Upgrade deleted an unrelated file" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ne (Join-Path $installDir "IPscans-Plus.exe")) { throw "Shortcut points to $target" }
          $process = Start-Process -FilePath (Join-Path $installDir "IPscans-Plus.exe") -ArgumentList "--selftest" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed application selftest failed" }
          $uninstaller = Join-Path $installDir "unins000.exe"
          $process = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path $shortcut)) { throw "IPscans+ uninstall failed" }

      - name: Record package checksums
        run: |
          Get-FileHash dist\IPscans-Plus.exe, dist\installer\IPscans-Plus-Setup.exe -Algorithm SHA256 |
            Select-Object Path, Hash | ConvertTo-Json | Set-Content dist\checksums.json

      - uses: actions/upload-artifact@v4
        with:
          name: IPscans-Plus-validation
          path: |
            desktop-app/scanner-benchmark.json
            desktop-app/native-benchmark.json
            desktop-app/dist/checksums.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: IPscans-Plus-portable
          path: desktop-app/dist/IPscans-Plus.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: IPscans-Plus-Setup
          path: desktop-app/dist/installer/IPscans-Plus-Setup.exe
          if-no-files-found: error
