name: Build Windows desktop app

on:
  push:
    branches: [main]
    paths:
      - "desktop-app/**"
      - ".github/workflows/build-desktop-app.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build one-file .exe
        run: |
          pyinstaller --name ipscans-network-scanner --onefile --windowed `
            --icon=assets/icon.ico `
            --add-data "assets;assets" `
            main.py

      - name: Smoke test the packaged .exe
        run: |
          .\dist\ipscans-network-scanner.exe --selftest

      - name: Publish built .exe to the website's download folder
        run: |
          Copy-Item -Path "dist\ipscans-network-scanner.exe" -Destination "..\public\downloads\ipscans-network-scanner.exe" -Force

      - name: Commit updated .exe
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/ipscans-network-scanner.exe
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: publish rebuilt desktop app .exe [skip ci]"
          git push


      - uses: actions/upload-artifact@v4
        with:
          name: ipscans-network-scanner-windows
          path: desktop-app/dist/ipscans-network-scanner.exe
          if-no-files-found: error
