name: Build Windows desktop app

on:
  push:
    branches: [main]
    paths:
      - "desktop-app/**"
      - ".github/workflows/build-desktop-app.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build one-file .exe
        run: |
          # --noupx: UPX-compressed executables are one of the most common
          # patterns Defender/SmartScreen heuristics flag on unsigned
          # binaries ("packed executable"), so compression is disabled.
          # --version-file: embeds normal-looking publisher/product metadata,
          # which unsigned-but-metadata-less exes lack and heuristics dislike.
          pyinstaller --name ipscans-network-scanner --onefile --windowed --noupx `
            --icon=assets/icon.ico `
            --version-file=version_info.txt `
            --add-data "assets;assets" `
            main.py

      - name: Smoke test the packaged .exe
        run: |
          .\dist\ipscans-network-scanner.exe --selftest

      - name: Publish built .exe to the website's download folder
        run: |
          New-Item -ItemType Directory -Force -Path "..\public\downloads" | Out-Null
          Copy-Item -Path "dist\ipscans-network-scanner.exe" -Destination "..\public\downloads\ipscans-network-scanner.exe" -Force

      - name: Commit updated .exe
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/ipscans-network-scanner.exe
          if (Test-Path "public\downloads\ipscans-network-scanner.zip") {
            git rm --cached public/downloads/ipscans-network-scanner.zip
            Remove-Item "public\downloads\ipscans-network-scanner.zip"
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            echo "No changes to commit"
          } else {
            git commit -m "chore: publish rebuilt desktop app .exe [skip ci]"
            # The Pro-app workflow also watches desktop-app/** and can run
            # concurrently on the same push, racing to push this branch —
            # retry with a rebase onto whatever landed first instead of
            # failing the whole job over a lost push race.
            $pushed = $false
            for ($i = 1; $i -le 5; $i++) {
              git push
              if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
              git fetch origin main
              git rebase origin/main
            }
            if (-not $pushed) { throw "git push failed after retries" }
          }


      - uses: actions/upload-artifact@v4
        with:
          name: ipscans-network-scanner-windows
          path: desktop-app/dist/ipscans-network-scanner.exe
          if-no-files-found: error
