name: Build Windows desktop app

on:
  push:
    branches: [main]
    paths:
      - "desktop-app/**"
      - ".github/workflows/build-desktop-app.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build one-dir app
        run: |
          # --onedir (not --onefile): a single self-extracting exe re-unpacks
          # 40+ DLLs to a temp folder on *every* launch, which is both slow on
          # first run and one of the most common patterns Windows
          # Defender/SmartScreen heuristically flags/quarantines on unsigned
          # binaries — the exact "downloads fine, double-click does nothing"
          # symptom this is fixing. --onedir starts instantly and is far less
          # likely to be silently deleted by antivirus after download.
          pyinstaller --name ipscans-network-scanner --onedir --windowed `
            --icon=assets/icon.ico `
            --add-data "assets;assets" `
            main.py

      - name: Smoke test the packaged app
        run: |
          .\dist\ipscans-network-scanner\ipscans-network-scanner.exe --selftest

      - name: Zip the packaged app
        run: |
          Compress-Archive -Path "dist\ipscans-network-scanner\*" -DestinationPath "dist\ipscans-network-scanner.zip" -Force

      - name: Publish built app to the website's download folder
        run: |
          New-Item -ItemType Directory -Force -Path "..\public\downloads" | Out-Null
          Copy-Item -Path "dist\ipscans-network-scanner.zip" -Destination "..\public\downloads\ipscans-network-scanner.zip" -Force

      - name: Commit updated app archive
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/ipscans-network-scanner.zip
          if (Test-Path "public\downloads\ipscans-network-scanner.exe") {
            git rm --cached public/downloads/ipscans-network-scanner.exe
            Remove-Item "public\downloads\ipscans-network-scanner.exe"
          }
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: publish rebuilt desktop app archive [skip ci]"
          git push


      - uses: actions/upload-artifact@v4
        with:
          name: ipscans-network-scanner-windows
          path: desktop-app/dist/ipscans-network-scanner.zip
          if-no-files-found: error
