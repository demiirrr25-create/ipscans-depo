name: Build IPCast

# Build and verify IPCast on Windows and Linux. On successful main-branch Windows builds,
# publish the self-contained EXE as a GitHub prerelease asset for the website download button.

on:
  push:
    branches: [main]
    paths:
      - "ipcast/**"
      - ".github/workflows/build-ipcast.yml"
  pull_request:
    paths:
      - "ipcast/**"
      - ".github/workflows/build-ipcast.yml"
  workflow_dispatch: {}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ipcast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish self-contained win-x64 EXE
        if: matrix.os == 'windows-latest'
        run: >
          dotnet publish src/IPCast.Client/IPCast.Client.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Smoke test IPCast window startup and shutdown
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:IPCAST_DATA_DIR = Join-Path $env:RUNNER_TEMP "IPCastSmoke"
          $env:IPCAST_RELAY_SERVER = "ws://127.0.0.1:1/relay"
          $process = Start-Process -FilePath "publish\win-x64\IPCast.exe" -PassThru
          try {
            $null = $process.WaitForInputIdle(15000)
            $process.Refresh()
            if ($process.HasExited -or $process.MainWindowHandle -eq [IntPtr]::Zero) {
              throw "IPCast did not create its main window."
            }
            Write-Host "IPCast main window opened: $($process.MainWindowTitle) (handle $($process.MainWindowHandle))."
          }
          finally {
            if (-not $process.HasExited) {
              $closeSent = $process.CloseMainWindow()
              Write-Host "CloseMainWindow returned: $closeSent."
              if (-not $process.WaitForExit(20000)) {
                $process.Refresh()
                Write-Host "Process still running: title='$($process.MainWindowTitle)', handle=$($process.MainWindowHandle), responding=$($process.Responding)."
                Stop-Process -Id $process.Id -Force
                throw "IPCast did not shut down after its main window closed."
              }
              Write-Host "IPCast exited with code $($process.ExitCode)."
            }
            if (Test-Path $env:IPCAST_DATA_DIR) {
              Remove-Item -Path $env:IPCAST_DATA_DIR -Recurse -Force
            }
          }

      - name: Upload IPCast.exe artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: IPCast-win-x64
          path: ipcast/publish/win-x64/IPCast.exe
          if-no-files-found: error

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y --no-progress

      - name: Build installer (IPCast-Setup.exe)
        if: matrix.os == 'windows-latest'
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer\IPCast.iss

      - name: Smoke test the installer (silent install, verify, uninstall)
        if: matrix.os == 'windows-latest'
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "IPCastInstallTest"
          Start-Process -FilePath "publish\installer\IPCast-Setup.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"" `
            -Wait
          if (-not (Test-Path (Join-Path $installDir "IPCast.exe"))) {
            throw "Installer did not deploy IPCast.exe to $installDir"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $installDir "IPCast.exe")) {
            throw "Uninstaller did not remove IPCast.exe from $installDir"
          }

      - name: Upload installer artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: IPCast-Setup
          path: ipcast/publish/installer/IPCast-Setup.exe
          if-no-files-found: error

  publish-download:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: IPCast-win-x64
          path: release

      - name: Publish IPCast Windows download
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = "ipcast-latest";
            let release;
            try {
              const result = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = result.data;
            } catch (error) {
              if (error.status !== 404) throw error;
              const result = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: "main",
                name: "IPCast for Windows",
                body: "Latest self-contained IPCast Windows x64 build.",
                draft: false,
                prerelease: true,
                make_latest: "false",
              });
              release = result.data;
            }

            const previousAsset = release.assets.find((asset) => asset.name === "IPCast.exe");
            if (previousAsset) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: previousAsset.id,
              });
            }

            const fs = require("fs");
            const fileData = fs.readFileSync("release/IPCast.exe");
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: "IPCast.exe",
              data: fileData,
              headers: {
                "content-type": "application/octet-stream",
                "content-length": fileData.length,
              },
            });
