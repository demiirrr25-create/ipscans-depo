name: Build IPCast

# Build and verify IPCast on Windows and Linux. Publishing requires a separate manual dispatch
# after release acceptance. Unsigned artifacts must be disclosed until a trusted signing
# certificate is available; SHA-256 guards against accidental artifact mismatch.

on:
  push:
    branches: [main]
    paths:
      - "ipcast/**"
      - ".github/workflows/build-ipcast.yml"
  pull_request:
    paths:
      - "ipcast/**"
      - ".github/workflows/build-ipcast.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the verified Windows executable after release acceptance"
        required: true
        type: boolean
        default: false

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ipcast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish self-contained win-x64 EXE
        if: matrix.os == 'windows-latest'
        run: >
          dotnet publish src/IPCast.Client/IPCast.Client.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Smoke test IPCast window startup and shutdown
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:IPCAST_DATA_DIR = Join-Path $env:RUNNER_TEMP "IPCastSmoke"
          $env:IPCAST_RELAY_SERVER = "ws://127.0.0.1:1/relay"
          $process = Start-Process -FilePath "publish\win-x64\IPCast.exe" -PassThru
          try {
            $ready = [System.Threading.SpinWait]::SpinUntil([Func[bool]] {
              $process.Refresh()
              return $process.HasExited -or ($process.MainWindowHandle -ne [IntPtr]::Zero -and $process.MainWindowTitle.StartsWith("IPCast") -and $process.Responding)
            }, 30000)
            if (-not $ready -or $process.HasExited) {
              throw "IPCast did not create its main window."
            }
            Write-Host "IPCast main window opened: $($process.MainWindowTitle) (handle $($process.MainWindowHandle))."
            if (-not $process.CloseMainWindow()) {
              throw "IPCast rejected the window close request."
            }
            if (-not $process.WaitForExit(20000)) {
              throw "IPCast did not shut down after the window close request."
            }
            if ($process.ExitCode -ne 0) {
              throw "IPCast exited with code $($process.ExitCode)."
            }
            Write-Host "IPCast opened and closed successfully."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
            if (Test-Path $env:IPCAST_DATA_DIR) {
              Remove-Item -Path $env:IPCAST_DATA_DIR -Recurse -Force
            }
          }

      - name: Record executable SHA-256
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'publish\win-x64\IPCast.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content 'publish\win-x64\IPCast.exe.sha256' "$hash  IPCast.exe" -NoNewline

      - name: Upload IPCast.exe artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: IPCast-win-x64
          path: |
            ipcast/publish/win-x64/IPCast.exe
            ipcast/publish/win-x64/IPCast.exe.sha256
          if-no-files-found: error

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y --no-progress

      - name: Build installer (IPCast-Setup.exe)
        if: matrix.os == 'windows-latest'
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer\IPCast.iss

      - name: Smoke test the installer (silent install, verify, uninstall)
        if: matrix.os == 'windows-latest'
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "IPCastInstallTest"
          Start-Process -FilePath "publish\installer\IPCast-Setup.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"" `
            -Wait
          if (-not (Test-Path (Join-Path $installDir "IPCast.exe"))) {
            throw "Installer did not deploy IPCast.exe to $installDir"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $installDir "IPCast.exe")) {
            throw "Uninstaller did not remove IPCast.exe from $installDir"
          }

      - name: Upload installer artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: IPCast-Setup
          path: ipcast/publish/installer/IPCast-Setup.exe
          if-no-files-found: error

  publish-download:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: IPCast-win-x64
          path: release

      - name: Verify release checksum
        run: sha256sum --check IPCast.exe.sha256
        working-directory: release

      - name: Publish IPCast Windows download
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const fs = require("fs");
            const fileData = fs.readFileSync("release/IPCast.exe");
            const checksumData = fs.readFileSync("release/IPCast.exe.sha256");
            const checksum = checksumData.toString("utf8").trim().split(/\s+/)[0];

            const targets = [
              { tag: "v2.0.0", name: "IPCast-2.0.0.exe", releaseName: "IPCast 2.0.0 Enterprise" },
              { tag: "ipcast-latest", name: "IPCast.exe", releaseName: "IPCast for Windows" }
            ];

            for (const target of targets) {
              let release;
              try {
                const result = await github.rest.repos.getReleaseByTag({ owner, repo, tag: target.tag });
                release = result.data;
              } catch (error) {
                if (error.status !== 404) throw error;
                const result = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: target.tag,
                  target_commitish: "main",
                  name: target.releaseName,
                  body: "Self-contained IPCast Windows x64 build. This executable is currently unsigned. Verify its SHA-256 against the attached checksum.",
                  draft: false,
                  prerelease: false,
                });
                release = result.data;
              }

              const checksumName = `${target.name}.sha256`;
              const targetChecksumData = Buffer.from(`${checksum}  ${target.name}\n`);
              for (const assetName of [target.name, "IPCast-2.0.0.exe", "IPCast.exe", checksumName]) {
                const previousAsset = (release.assets || []).find((asset) => asset.name === assetName);
                if (previousAsset) {
                  try {
                    await github.rest.repos.deleteReleaseAsset({
                      owner,
                      repo,
                      asset_id: previousAsset.id,
                    });
                  } catch (e) {}
                }
              }

              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: target.name,
                data: fileData,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": fileData.length,
                },
              });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo,
                release_id: release.id,
                name: checksumName,
                data: targetChecksumData,
                headers: {
                  "content-type": "text/plain",
                  "content-length": targetChecksumData.length,
                },
              });
            }
