name: Web checks
on:
  pull_request:
    paths: ["src/**", "tools/**", "package*.json", ".github/workflows/web-checks.yml"]
  push:
    branches: [main]
    paths: ["src/**", "tools/**", "package*.json", ".github/workflows/web-checks.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
