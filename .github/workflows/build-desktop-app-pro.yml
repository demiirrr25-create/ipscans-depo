name: Build Windows desktop app (Pro)

on:
  push:
    branches: [main]
    paths:
      - "desktop-app-pro/**"
      - "desktop-app/**" # Pro reuses the free app's UI/scanner engine — rebuild on either change
      - ".github/workflows/build-desktop-app-pro.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app-pro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build one-file .exe
        run: |
          # --paths: lets PyInstaller's static analysis resolve and bundle
          # `app.*` imports from the sibling free desktop-app project (this
          # repo never copies that source into desktop-app-pro — see README).
          # --noupx / --version-file: same Defender/SmartScreen-heuristic
          # rationale as the free app's own build step.
          # --icon: the product-specific icon (assets/icon_pro.ico) —
          # this is what Explorer/taskbar/"pin to desktop" actually shows,
          # since that's read from the .exe's own Win32 resources, not the
          # QIcon set at runtime. Both assets dirs are added so the runtime
          # PNG fallback (ui/pro_resources.py) and the free app's own logo
          # (used by the embedded Scanner tab) are both available frozen.
          pyinstaller --name ipscans-network-health-pro --onefile --windowed --noupx `
            --paths ..\desktop-app `
            --icon=assets\icon_pro.ico `
            --version-file=version_info.txt `
            --add-data "..\desktop-app\assets;assets" `
            --add-data "assets;assets" `
            main.py

      - name: Smoke test the packaged .exe
        run: |
          .\dist\ipscans-network-health-pro.exe --selftest

      - name: Install Inno Setup and build installer
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer\HealthPro.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Smoke test installer and desktop shortcut
        run: |
          $setup = (Resolve-Path "dist\installer\Network-Health-Pro-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "HealthProInstallTest"
          $shortcut = Join-Path ([Environment]::GetFolderPath("DesktopDirectory")) "Network Health Pro.lnk"
          $process = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $installDir "ipscans-network-health-pro.exe")) -or -not (Test-Path $shortcut)) {
            throw "Health Pro install or desktop shortcut failed"
          }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ne (Join-Path $installDir "ipscans-network-health-pro.exe")) { throw "Health Pro shortcut points to $target" }
          $uninstaller = Join-Path $installDir "unins000.exe"
          $process = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path $shortcut)) { throw "Health Pro uninstall failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: ipscans-network-health-pro-windows
          path: desktop-app-pro/dist/ipscans-network-health-pro.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Network-Health-Pro-Setup
          path: desktop-app-pro/dist/installer/Network-Health-Pro-Setup.exe
          if-no-files-found: error
