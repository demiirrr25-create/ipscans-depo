name: Build Windows desktop app (Pro)

on:
  push:
    branches: [main]
    paths:
      - "desktop-app-pro/**"
      - "desktop-app/**" # Pro reuses the free app's UI/scanner engine — rebuild on either change
      - ".github/workflows/build-desktop-app-pro.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app-pro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build one-file .exe
        run: |
          # --paths: lets PyInstaller's static analysis resolve and bundle
          # `app.*` imports from the sibling free desktop-app project (this
          # repo never copies that source into desktop-app-pro — see README).
          # --noupx / --version-file: same Defender/SmartScreen-heuristic
          # rationale as the free app's own build step.
          # --icon: the PRE-BAKED PRO-badged icon (assets/icon_pro.ico) —
          # this is what Explorer/taskbar/"pin to desktop" actually shows,
          # since that's read from the .exe's own Win32 resources, not the
          # QIcon set at runtime. Both assets dirs are added so the runtime
          # PNG fallback (ui/pro_resources.py) and the free app's own logo
          # (used by the embedded Scanner tab) are both available frozen.
          pyinstaller --name ipscans-network-health-pro --onefile --windowed --noupx `
            --paths ..\desktop-app `
            --icon=assets\icon_pro.ico `
            --version-file=version_info.txt `
            --add-data "..\desktop-app\assets;assets" `
            --add-data "assets;assets" `
            main.py

      - name: Smoke test the packaged .exe
        run: |
          .\dist\ipscans-network-health-pro.exe --selftest

      - name: Publish built .exe to the website's download folder
        run: |
          New-Item -ItemType Directory -Force -Path "..\public\downloads" | Out-Null
          Copy-Item -Path "dist\ipscans-network-health-pro.exe" -Destination "..\public\downloads\ipscans-network-health-pro.exe" -Force

      - name: Commit updated .exe
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/ipscans-network-health-pro.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            echo "No changes to commit"
          } else {
            git commit -m "chore: publish rebuilt Network Health Pro .exe [skip ci]"
            # The free-app workflow also watches desktop-app/** (this Pro
            # app reuses its source) and can run concurrently on the same
            # push, racing to push this branch — retry with a rebase onto
            # whatever landed first instead of failing the whole job over
            # a lost push race.
            $pushed = $false
            for ($i = 1; $i -le 5; $i++) {
              git push
              if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
              git fetch origin main
              git rebase origin/main
            }
            if (-not $pushed) { throw "git push failed after retries" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ipscans-network-health-pro-windows
          path: desktop-app-pro/dist/ipscans-network-health-pro.exe
          if-no-files-found: error
